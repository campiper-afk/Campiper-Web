<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Cursos - LMS</title>
  
  <!-- Tipografías de tu mockup original -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            head: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
          colors: {
            dark: '#1E1E24',
            darkAlt: '#26262E',
            darkLine: '#34343E',
            bluePrimary: '#4A90E2',
            orangePrimary: '#FF6B35',
            orangeDeep: '#E0552A',
            textLight: '#F5F5F7',
            textMuted: '#A9ADBB',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #1E1E24; color: #F5F5F7; }
    /* Estilos base para los botones de filtro */
    .filter-btn {
      transition: all 0.2s ease;
    }
    .filter-btn.active {
      background-color: #FF6B35;
      color: #1E1E24;
      font-weight: 700;
    }
    /* Efecto hover suave en la tarjeta */
    .course-card:hover {
      transform: translateY(-4px);
      border-color: #4A90E2;
    }
  </style>
</head>
<body class="font-body antialiased min-h-screen p-8">

  <div class="max-w-[1180px] mx-auto">
    
    <!-- Encabezado del Catálogo -->
    <header class="mb-10 text-center md:text-left">
      <h1 class="font-head text-3xl md:text-4xl font-bold mb-4">Contenido del Curso</h1>
      <p class="text-textMuted text-lg max-w-2xl">Descubre todo lo que nuestro curso tiene para ofrecer.</p>
    </header>

    
    <!-- Grid de Tarjetas -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="course-grid">
      <!-- Las tarjetas se inyectarán aquí mediante JavaScript -->
    </div>

  </div>

  <script>
    // 1. Base de datos simulada (JSON)
    const cursos = [
      {
        id: 1,
        titulo: "Primeros pasos en Davinci Resolve",
        categoria: "edicion",
        nivel: "Primer Modulo",
        precio: "",
        imagen: "https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        descripcion: "Este módulo introductorio establece las bases para comenzar a utilizar el software, guiándote a través del proceso de instalación y su configuración inicial."
      },
      {
        id: 2,
        titulo: "Edicion básica de video",
        categoria: "edicion",
        nivel: "Segundo Modulo",
        precio: "",
        imagen: "https://images.unsplash.com/photo-1677442136019-21780ecad995?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        descripcion: "En esta sección aprenderás a dominar la edición básica manejando cortes, transiciones y la línea de tiempo."
      },
      {
        id: 3,
        titulo: "Introducción al color granding",
        categoria: "edicion",
        nivel: "Tercer Modulo",
        precio: "",
        imagen: "https://images.unsplash.com/photo-1555099962-4199c345e5dd?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        descripcion: "Explora la rueda de color primaria para distinguir entre corrección de color y estilización, dominando también el uso de scopes como el waveform."
      },
      {
        id: 4,
        titulo: "Audio y entrega final",
        categoria: "ia",
        nivel: "Cuarto Modulo",
        precio: "",
        imagen: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        descripcion: "Aplica la mezcla básica de audio en Fairlight y configura los ajustes de exportación para optimizar tus videos en redes sociales"
      }
    ];

    const gridContenedor = document.getElementById('course-grid');
    const botonesFiltro = document.querySelectorAll('.filter-btn');

    // 2. Función para renderizar las tarjetas
    function renderizarCursos(cursosFiltrados) {
      gridContenedor.innerHTML = ''; // Limpiar grid

      if (cursosFiltrados.length === 0) {
        gridContenedor.innerHTML = '<p class="text-textMuted">No se encontraron cursos en esta categoría.</p>';
        return;
      }

      cursosFiltrados.forEach(curso => {
        const tarjeta = document.createElement('div');
        // Clases de Tailwind basadas en tu diseño de módulos/pricing
        tarjeta.className = "course-card bg-darkAlt border border-darkLine rounded-[20px] overflow-hidden flex flex-col transition-all duration-300";
        
        tarjeta.innerHTML = `
          <!-- Imagen del curso -->
          <div class="h-48 overflow-hidden relative bg-[#17171c]">
            <img src="${curso.imagen}" alt="${curso.titulo}" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity">
            <span class="absolute top-4 left-4 bg-orangePrimary text-dark font-head font-bold text-xs px-3 py-1.5 rounded-full">
              ${curso.nivel}
            </span>
          </div>
          
          <!-- Contenido -->
          <div class="p-6 flex flex-col flex-grow">
            <h3 class="font-head text-xl font-bold mb-2 leading-tight">${curso.titulo}</h3>
            <p class="text-textMuted text-sm mb-6 flex-grow">${curso.descripcion}</p>
            
            <!-- Pie de tarjeta (Precio y Botón) -->
            <div class="flex items-center justify-between mt-auto pt-4 border-t border-darkLine">
              <span class="font-head font-bold text-xl">${curso.precio}</span>
              <a href="#" class="text-orangePrimary font-semibold text-sm hover:text-orangeDeep flex items-center gap-1 transition-colors">
                Ver detalle
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </a>
            </div>
          </div>
        `;
        gridContenedor.appendChild(tarjeta);
      });
    }

    // 3. Lógica de Filtrado
    botonesFiltro.forEach(boton => {
      boton.addEventListener('click', (e) => {
        // Quitar clase active de todos
        botonesFiltro.forEach(btn => {
          btn.classList.remove('active');
          btn.classList.add('bg-darkAlt', 'text-textMuted');
        });
        
        // Poner clase active al botón clickeado
        const btnSeleccionado = e.target;
        btnSeleccionado.classList.add('active');
        btnSeleccionado.classList.remove('bg-darkAlt', 'text-textMuted');

        // Filtrar array
        const categoriaSeleccionada = btnSeleccionado.getAttribute('data-filter');
        
        if (categoriaSeleccionada === 'todos') {
          renderizarCursos(cursos);
        } else {
          const filtrados = cursos.filter(curso => curso.categoria === categoriaSeleccionada);
          renderizarCursos(filtrados);
        }
      });
    });

    // 4. Inicializar vista con todos los cursos
    renderizarCursos(cursos);
  </script>
</body>
</html>
