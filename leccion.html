<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lección - Campiper</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="lesson-page">
    
    <!-- HEADER -->
    <header class="lesson-nav">
      <a class="brand" href="index.html" aria-label="Campiper, ir al inicio">
        <img alt="Campiper Logo" aria-hidden="true" class="brand-logo" src="img/campiper-logo.png" />
      </a>
      <nav aria-label="Navegación principal">
        <a href="index.html#requisitos">Requisitos</a>
        <a href="catalogo.html">Contenido</a>
        <a href="index.html#oferta">Precio</a>
      </nav>
      <a class="lesson-login" data-solo="visitante" href="registro.html">Iniciar Sesión</a>
      <div class="student-menu" data-solo="usuario" hidden>
        <a href="mis-cursos.html">Mis cursos</a>
        <a href="index.html" data-salir>Salir</a>
        <span aria-hidden="true" data-usuario-inicial></span>
      </div>
    </header>

    <main class="lesson-main">
      <a class="lesson-back" href="catalogo.html">
        <span>
          <svg aria-hidden="true" fill="none" height="19" viewBox="0 0 24 24" width="19">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m14 6-6 6 6 6M8 12h11" />
          </svg>
        </span>
        Volver al Catálogo
      </a>

      <!-- REPRODUCTOR DE VIDEO -->
      <section class="video-player" id="video-player" aria-label="Reproductor de la lección">
        <img alt="Línea de tiempo de un proyecto de edición de video" src="https://images.unsplash.com/photo-1614963326505-843868e1d83a?crop=entropy&cs=tinysrgb&fit=crop&fm=jpg&q=88&w=1600" />
        <div class="video-shade"></div>
        <button aria-label="Reproducir lección" class="lesson-play-button" id="btn-play">
          <svg id="icon-play-pause" aria-hidden="true" fill="none" height="31" viewBox="0 0 24 24" width="31">
            <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
              <path d="m9 7 8 5-8 5V7Z" id="path-play" />
              <path d="M9 8v8M15 8v8" id="path-pause" style="display: none;" />
            </g>
          </svg>
        </button>
        <div class="video-status">
          <span id="video-status-text">VISTA PREVIA</span>
          <strong id="lesson-duration">--:--</strong>
        </div>
        <div class="video-progress"><span></span></div>
      </section>

      <!-- CONTENIDO DE LA LECCIÓN -->
      <section class="lesson-content">
        <div class="lesson-copy">
          <span class="lesson-eyebrow" id="lesson-eyebrow">MÓDULO 2 · LECCIÓN --</span>
          <h1 id="lesson-title">Cargando...</h1>
          <p id="lesson-desc"></p>
        </div>
        <a class="next-lesson" id="btn-next-lesson" href="#">
          <span><small>CONTINUAR CON</small><b id="next-lesson-text">Siguiente lección</b></span>
          <svg aria-hidden="true" fill="none" height="19" viewBox="0 0 24 24" width="19">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </a>
      </section>

      <!-- MATERIAL DE DESCARGA -->
      <section class="class-material">
        <div class="material-heading">
          <span class="material-icon">
            <svg aria-hidden="true" fill="none" height="21" viewBox="0 0 24 24" width="21">
              <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4" /><path d="M5 19h14" />
              </g>
            </svg>
          </span>
          <div>
            <span>RECURSOS</span>
            <h2>Material de la clase</h2>
          </div>
        </div>
        <button class="download-card" id="btn-download">
          <span>
            <svg aria-hidden="true" fill="none" height="20" viewBox="0 0 24 24" width="20">
              <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4" /><path d="M5 19h14" />
              </g>
            </svg>
          </span>
          <span>
            <strong id="material-title">Cargando recursos...</strong>
            <small id="material-file">---</small>
          </span>
          <svg aria-hidden="true" fill="none" height="18" viewBox="0 0 24 24" width="18">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 12h14m-6-6 6 6-6 6" />
          </svg>
        </button>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
