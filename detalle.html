<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Módulo - Campiper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body class="pagina-detalle">

  <div class="detalle-contenedor">
    <!-- Botón de regreso -->
    <a href="catalogo.html" class="link-volver">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Volver al contenido del curso
    </a>

    <!-- Encabezado dinámico del módulo -->
    <span id="mod-etiqueta" class="insignia insignia-detalle">Cargando...</span>
    <h1 id="mod-titulo" class="titulo-pagina">Cargando módulo...</h1>
    <p id="mod-desc" class="detalle-descripcion"></p>

    <!-- Lista de lecciones dinámica -->
    <div class="caja panel-lecciones">
      <h2 class="titulo-seccion">Lecciones de este módulo</h2>
      <ul id="lesson-list" class="lista-lecciones">
         <!-- Las lecciones se inyectan aquí con JS -->
      </ul>
    </div>

    <!-- Instructor y Compra (Fijos para todo el curso) -->
    <div class="detalle-columnas">
       <div class="caja instructor-tarjeta">
          <h3 class="instructor-titulo">Instructor</h3>
          <p class="instructor-texto">Aprende de la mano de un experto en postproducción audiovisual.</p>
          <div class="fila-icono">
             <div class="instructor-avatar">JP</div>
             <span class="instructor-nombre">Jean Paul G.</span>
          </div>
       </div>

       <div class="caja compra-tarjeta">
          <p class="compra-etiqueta">Precio del curso completo</p>
          <p class="compra-precio">$149.000</p>
          <button class="boton-comprar">
            Comprar curso completo
          </button>
       </div>
    </div>
  </div>

</body>
</html>
