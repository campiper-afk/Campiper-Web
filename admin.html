<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control - CamPiper Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- SCRIPT DE SEGURIDAD FRONTEND -->
<script>
  document.documentElement.style.display = 'none';
  document.addEventListener('DOMContentLoaded', () => {
    const isAdmin = sessionStorage.getItem('campiper_admin_auth');
    if (isAdmin !== 'true') {
      const password = prompt('Acceso Restringido. Ingrese la clave de administrador:');
      // LA CLAVE ES: campiper2026
      if (password === 'campiper2026') {
        sessionStorage.setItem('campiper_admin_auth', 'true');
        document.documentElement.style.display = 'block';
      } else {
        alert('Acceso denegado. Serás redirigido al inicio.');
        window.location.replace('index.html');
      }
    } else {
      document.documentElement.style.display = 'block';
    }
  });
</script>

<style>
  :root {
    --dark: #1E1E24;
    --dark-alt: #26262E;
    --dark-line: #34343E;
    --blue: #4A90E2;
    --orange: #FF6B35;
    --text-light: #F5F5F7;
    --text-muted: #A9ADBB;
    --font-head: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  
  body {
    margin: 0;
    background: var(--dark);
    color: var(--text-light);
    font-family: var(--font-body);
    display: flex;
    height: 100vh;
  }

  /* Barra lateral del admin */
  .sidebar {
    width: 260px;
    background: var(--dark-alt);
    border-right: 1px solid var(--dark-line);
    padding: 24px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    font-family: var(--font-head);
    font-size: 1.2rem;
    color: var(--orange);
    margin-bottom: 40px;
  }
  .menu-item {
    color: var(--text-muted);
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 8px;
    transition: background 0.2s;
  }
  .menu-item:hover, .menu-item.active {
    background: rgba(74, 144, 226, 0.1);
    color: var(--blue);
  }

  /* Contenido principal */
  .main-content {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
  }
  h1 { font-family: var(--font-head); margin-top: 0; }

  /* Header del Admin y Búsqueda */
  .admin-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
  }
  .table-actions { display: flex; gap: 12px; }
  #searchInput {
    background: var(--dark-alt); border: 1px solid var(--dark-line);
    color: var(--text-light); padding: 10px 16px; border-radius: 8px;
    font-family: var(--font-body); width: 300px;
  }
  #searchInput:focus { outline: none; border-color: var(--blue); }
  .btn-primary {
    background: var(--orange); color: var(--text-on-orange); border: none;
    padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;
  }

  /* Estilos de la Tabla */
  .table-container {
    background: var(--dark-alt); border: 1px solid var(--dark-line);
    border-radius: 12px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th {
    background: rgba(30, 30, 36, 0.5); padding: 16px 24px; font-size: 0.85rem;
    color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--dark-line);
  }
  td { padding: 16px 24px; border-bottom: 1px solid var(--dark-line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

  /* Info del Usuario en la Tabla */
  .user-info { display: flex; align-items: center; gap: 12px; }
  .user-avatar {
    width: 40px; height: 40px; background: var(--dark-line); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--text-light);
  }
  .user-name { font-weight: 600; font-size: 0.95rem; }
  .user-email { font-size: 0.8rem; color: var(--text-muted); }

  /* Barra de Progreso */
  .progress-bar-container { display: flex; align-items: center; gap: 10px; }
  .progress-fill {
    height: 8px; background: var(--blue); border-radius: 4px;
    min-width: 100px; position: relative;
  }
  .progress-fill::before {
    content: ''; position: absolute; top: 0; left: 0; right: -100px;
    height: 100%; background: var(--dark-line); z-index: -1; border-radius: 4px;
  }
  .progress-text { font-size: 0.85rem; font-weight: 600; }

  /* Etiquetas de Estado */
  .status { padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .status.active { background: rgba(74, 144, 226, 0.15); color: var(--blue); }
  .status.completed { background: rgba(39, 201, 63, 0.15); color: #27c93f; }
  .status.inactive { background: rgba(255, 107, 53, 0.15); color: var(--orange); }

  .btn-action {
    background: transparent; border: 1px solid var(--dark-line);
    color: var(--text-light); padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .btn-action:hover { border-color: var(--blue); color: var(--blue); }
</style>
</head>
<body>

  <!-- Barra lateral (menú) -->
  <aside class="sidebar">
    <div class="brand">CamPiper Admin</div>
    <a href="#" class="menu-item active">Gestión de Estudiantes</a>
    <a href="#" class="menu-item">Ventas y Reportes</a>
    <a href="#" class="menu-item" onclick="cerrarSesion()">Cerrar Sesión</a>
  </aside>

  <!-- Contenido principal (Tabla de estudiantes) -->
  <main class="main-content">
    <div class="admin-header">
      <h1>Gestión de Estudiantes</h1>
      <div class="table-actions">
        <!-- Barra de búsqueda conectada a JavaScript -->
        <input type="text" id="searchInput" placeholder="Buscar alumno por nombre o email..." onkeyup="filterTable()">
        <button class="btn-primary">Exportar CSV</button>
      </div>
    </div>

    <!-- La Tabla -->
    <div class="table-container">
      <table id="studentsTable">
        <thead>
          <tr>
            <th>Nombre del Estudiante</th>
            <th>Fecha de Inscripción</th>
            <th>Progreso</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
         
        <tbody id="listaEstudiantes">
      </table>
    </div>
  </main>

<script type="module">
  // Extraemos la información de Firebase usando la misma configuración de app.js
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

  // Copiamos la configuración exacta que tienes en tu app.js
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDicr1FaMUZMtKT_qThtaKv_TFGdeYhFpE",
    authDomain: "campiper-7414d.firebaseapp.com",
    projectId: "campiper-7414d",
    storageBucket: "campiper-7414d.firebasestorage.app",
    messagingSenderId: "984212599762",
    appId: "1:984212599762:web:0a0299a4350edcb2818e0b"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db = getFirestore(app);

  async function cargarEstudiantes() {
    const tbody = document.getElementById('listaEstudiantes'); 
    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Cargando estudiantes de Firebase...</td></tr>';

    try {
      // Tu app.js guarda a las personas en la colección 'users'
      const querySnapshot = await getDocs(collection(db, "users"));
      tbody.innerHTML = '';

      if (querySnapshot.empty) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay usuarios registrados aún.</td></tr>';
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const nombreReal = data.nombre || "Usuario";
        const correoReal = data.correo || "Sin correo";
        const iniciales = nombreReal.substring(0, 2).toUpperCase();

        const filaHTML = `
          <tr>
            <td>
              <div class="user-info">
                <span class="user-avatar">${iniciales}</span>
                <div>
                  <div class="user-name">${nombreReal}</div>
                  <div class="user-email">${correoReal}</div>
                </div>
              </div>
            </td>
            <td>Reciente</td>
            <td>
              <div class="progress-bar-container">
                <div class="progress-fill" style="width: 0%;"></div>
                <span class="progress-text">0%</span>
              </div>
            </td>
            <td><span class="status active">Activo</span></td>
            <td><button class="btn-action">Ver Perfil</button></td>
          </tr>
        `;
        tbody.innerHTML += filaHTML;
      });

    } catch (error) {
      console.error("Error al leer la base de datos:", error);
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Error al cargar datos. Verifica las reglas de Firestore.</td></tr>';
    }
  }

  // Ejecutar cuando se cargue la página
  document.addEventListener('DOMContentLoaded', () => {
    const isAdmin = sessionStorage.getItem('campiper_admin_auth');
    if (isAdmin === 'true') {
       cargarEstudiantes();
    }
  });

  // Funciones del Admin original (Para que los botones de cerrar sesión y buscar sigan funcionando)
  window.cerrarSesion = function() {
    sessionStorage.removeItem('campiper_admin_auth');
    window.location.replace('index.html');
  }

  window.filterTable = function() {
    const input = document.getElementById("searchInput");
    const filter = input.value.toUpperCase();
    const table = document.getElementById("studentsTable");
    const tr = table.getElementsByTagName("tr");

    for (let i = 1; i < tr.length; i++) {
      const td = tr[i].getElementsByTagName("td")[0]; 
      if (td) {
        const txtValue = td.textContent || td.innerText;
        tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
      }       
    }
  }
</script>
  
</body>
</html>
